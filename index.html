<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  height:100vh;
  transition: background 1s;
}

/* Light tropical gradient (day) */
body.day {
  color:#063a45;
  background: linear-gradient(
    180deg,
    #6ecbff,
    #7de2d1,
    #9be7a1,
    #ffeaa7
  );
}

/* Dark tropical gradient (night) */
body.night {
  color:#a4b9bd;
  background: linear-gradient(
    180deg,
    #1a2a40,
    #2a3b50,
    #3a5665,
    #557d8d
  );
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(2,1fr);
  gap:20px;
  padding:30px;
  height:100%;
  box-sizing:border-box;
}

.widget{
  border-radius:18px;
  overflow:hidden;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(0,0,0,0.15);
  transition: background 1s;
}

body.night .widget{
  background: rgba(0,0,0,0.4); /* slightly stronger night opacity */
  box-shadow: 0 8px 30px rgba(0,0,0,0.4); /* stronger shadow for contrast */
}

.widget iframe{
  border:none;
  width:100%;
  height:100%;
}
</style>
</head>

<body>

<div class="dashboard">
  <div class="widget"><iframe src="widgets/sun.html"></iframe></div>
  <div class="widget"><iframe src="widgets/pollen.html"></iframe></div>
  <div class="widget"><iframe src="widgets/spotify.html"></iframe></div>
  <div class="widget"><iframe src="widgets/photoalbum.html"></iframe></div>
  <div class="widget"><iframe src="widgets/tmrandom.html"></iframe></div>
  <div class="widget"><iframe src="widgets/aoty.html"></iframe></div>
</div>

<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<script>

let sunrise = new Date();
let sunset = new Date();

function setDefaultSun() {
  const now = new Date();
  sunrise = new Date(now); sunrise.setHours(6,30,0,0);
  sunset = new Date(now); sunset.setHours(18,0,0,0);
}

function setThemeBasedOnSun(sunrise, sunset){
  const now = new Date();
  const nowMs = now.getTime();
  const sunriseMs = sunrise.getTime();
  const sunsetMs = sunset.getTime();

  if(nowMs >= sunsetMs || nowMs < sunriseMs){
    document.body.classList.add("night");
    document.body.classList.remove("day");
  } else {
    document.body.classList.add("day");
    document.body.classList.remove("night");
  }

  sendThemeToWidgets();
}

function updateWidgetsTheme() {
  document.querySelectorAll(".widget iframe").forEach(iframe => {
    try {
      const doc = iframe.contentDocument || iframe.contentWindow.document;
      if(doc) {
        if(document.body.classList.contains("night")){
          doc.body.classList.add("night");
          doc.body.classList.remove("day");
        } else {
          doc.body.classList.add("day");
          doc.body.classList.remove("night");
        }
      }
    } catch(e) {
      // cross-origin iframes (Spotify, etc.) cannot be accessed
    }
  });
}

function initTheme() {
  setThemeBasedOnSun(sunrise, sunset);
  setInterval(()=>setThemeBasedOnSun(sunrise, sunset), 60000); // update every minute
}

// geolocation + fallback
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const times = SunCalc.getTimes(new Date(), lat, lon);
    sunrise = times.sunrise || new Date(new Date().setHours(6,30,0,0));
    sunset = times.sunset || new Date(new Date().setHours(18,0,0,0));
    initTheme();
  }, ()=>{
    setDefaultSun();
    initTheme();
  });
} else {
  setDefaultSun();
  initTheme();
}

function sendThemeToWidgets(){
  const theme = document.body.classList.contains("night") ? "night" : "day";

  document.querySelectorAll(".widget iframe").forEach(frame=>{
    frame.contentWindow.postMessage({theme: theme}, "*");
  });
}
</script>
</body>
</html>
