<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spotify Playlist</title>
<style>

body {
  color:#063a45;
  margin:0;
  padding:20px;
  font-family:system-ui;
}

body.day {
  color:#063a45;
  margin:0;
  padding:20px;
  font-family:system-ui;
  overflow: hidden;
}

body.night {
  color:#a4b9bd;
  margin:0;
  padding:20px;
  font-family:system-ui;
  overflow: hidden;
}

iframe{
border:none;
width:100%;
height:100%;
}

.title{
font-weight:600;
margin-bottom:8px;
}

</style>
</head>
<body>

<div class="title">☀  Playlists</div>

<iframe src="https://open.spotify.com/embed/playlist/7b6iJZDSkdOg3dsWE1iTab?si=b9e96f3974964223" 
allow="encrypted-media" allowtransparency="true"></iframe>
<!-- <iframe src="https://open.spotify.com/embed/playlist/55EhsrT1wf2kCE6qsAmFDl?si=0db50caa0f0e4ba6" 
allow="encrypted-media" allowtransparency="true"></iframe> -->
<iframe src="https://open.spotify.com/embed/playlist/2n0mmW5TWVFOaLfDGTzcjM?si=91e63e288fba4a6f" 
allow="encrypted-media" allowtransparency="true"></iframe>
<iframe src="https://open.spotify.com/embed/playlist/7mMgXWb0t86O3cZUspE2C9?si=39fe6838f8ed4670" 
allow="encrypted-media" allowtransparency="true"></iframe>

<script>

window.addEventListener("message", (event)=>{
  if(event.data.theme){
    document.body.classList.remove("day","night");
    document.body.classList.add(event.data.theme);
  }
});

</script>

</body>
</html>
