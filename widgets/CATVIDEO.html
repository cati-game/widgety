<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CATVIDEO</title>
<style>
  
body {
  color:#063a45;
  margin:0;
  padding:20px;
  font-family:system-ui;
}

body.day {
  color:#063a45;
  margin:0;
  padding:20px;
  font-family:system-ui;
}

body.night {
  color:#a4b9bd;
  margin:0;
  padding:20px;
  font-family:system-ui;
}

.button {
  padding:12px 22px;
  font-size:16px;
  font-weight:600;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background: linear-gradient(90deg,#ffb347,#ffd86f,#6ee7b7);
  color:#fff;
  margin-top:10px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.button:hover {
  transform:scale(1.05);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
</style>
</head>
<body>

<div class="title">☀ CATVIDEO</div>
<button class="button" id="randomBtn">Go to CATVIDEO</button>

<script>
document.getElementById("randomBtn").addEventListener("click", ()=>{
  window.open("https://cati-game.github.io/CATVIDEO/","_blank");
});

window.addEventListener("message", (event)=>{
  if(event.data.theme){
    document.body.classList.remove("day","night");
    document.body.classList.add(event.data.theme);
  }
});

</script>

</body>
</html>
