<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body.day {
  color:#063a45;
  margin:0;
  padding:20px;
  font-family:system-ui;
}

body.night {
  color:#a4b9bd;
  margin:0;
  padding:20px;
  font-family:system-ui;
}

.title{
font-weight:600;
margin-bottom:8px;
}

.level{
font-size:30px;
margin-bottom:6px;
}

.bar{
height:14px;
background:rgba(255,255,255,0.4);
border-radius:10px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:linear-gradient(
90deg,
#6ee7b7,
#fcd34d,
#fb7185
);
}

.type{
font-size:14px;
opacity:.8;
margin-top:6px;
}

</style>
</head>

<body>

<div class="title">☀  Pollen</div>

<div class="level" id="level">Loading...</div>

<div class="bar">
<div class="fill" id="pollenBar"></div>
</div>

<div class="type" id="type"></div>

<script>

async function loadPollen(lat,lon){

const url =
`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&hourly=alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen`

const res = await fetch(url)
const data = await res.json()

const hour = new Date().getHours()

const values = {
"Alder": data.hourly.alder_pollen[hour],
"Birch": data.hourly.birch_pollen[hour],
"Grass": data.hourly.grass_pollen[hour],
"Mugwort": data.hourly.mugwort_pollen[hour],
"Olive": data.hourly.olive_pollen[hour]
}

/* find highest pollen */

let maxType = null
let maxValue = -1

for(const [type,val] of Object.entries(values)){

if(val !== null && val > maxValue){
maxValue = val
maxType = type
}

}

/* normalize to 0-100 */

let percent = Math.min(100, maxValue*10)

document.getElementById("level").textContent =
percent.toFixed(0)+"%"

document.getElementById("pollenBar").style.width =
percent+"%"

document.getElementById("type").textContent =
"Dominant: "+maxType

}

/* get location */

navigator.geolocation.getCurrentPosition(pos=>{

const lat = pos.coords.latitude
const lon = pos.coords.longitude

loadPollen(lat,lon)

})

window.addEventListener("message", (event)=>{
  if(event.data.theme){
    document.body.classList.remove("day","night");
    document.body.classList.add(event.data.theme);
  }
});

</script>

</body>
</html>
